<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030613" />
  <title>Gallery // Helios Command</title>
  <style>
    :root { color-scheme:dark; --ink:#e8f7ff; --muted:#8aa4b7; --cyan:#68e4ff; --line:rgba(147,220,255,.25); }
    * { box-sizing:border-box; } html,body { margin:0; min-height:100%; } body { background:#030613; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; overflow-x:hidden; }
    #space { position:fixed; inset:0; width:100%; height:100%; z-index:-3; } .wash { position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(ellipse at 65% 22%,rgba(33,93,194,.14),transparent 34%),linear-gradient(180deg,rgba(1,5,15,.1),rgba(1,5,15,.75)); }
    .shell { min-height:100svh; padding:clamp(22px,4vw,60px); } header,footer,nav,.eyebrow,.caption { letter-spacing:.14em; text-transform:uppercase; } header { display:flex; align-items:center; gap:28px; font-size:11px; font-weight:600; color:var(--muted); } .brand { display:flex; align-items:center; gap:12px; color:var(--ink); white-space:nowrap; } .brand__mark { width:27px; height:27px; position:relative; border:1px solid var(--cyan); transform:rotate(45deg); box-shadow:0 0 18px rgba(104,228,255,.32),inset 0 0 12px rgba(104,228,255,.18); }.brand__mark:after { content:""; position:absolute; inset:7px; background:var(--cyan); box-shadow:0 0 14px var(--cyan); } nav { display:flex; gap:clamp(12px,2vw,28px); margin-left:auto; font-size:10px; } nav a { color:var(--muted); text-decoration:none; transition:color .2s ease; } nav a:hover,nav a[aria-current="page"] { color:var(--cyan); }
    main { max-width:1240px; margin:clamp(58px,10vw,118px) auto 0; } .heading { display:flex; align-items:end; justify-content:space-between; gap:28px; margin-bottom:37px; } .eyebrow { margin:0 0 13px; color:var(--cyan); font-size:11px; font-weight:700; } h1 { margin:0; font-family:"Arial Narrow",Impact,sans-serif; font-size:clamp(60px,10vw,142px); font-weight:500; line-height:.78; letter-spacing:-.065em; text-transform:uppercase; } h1 span { color:transparent; -webkit-text-stroke:1px rgba(210,244,255,.8); } .heading__note { max-width:235px; margin:0 0 4px; color:var(--muted); font:10px/1.7 "Courier New",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .gallery { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:clamp(12px,1.5vw,20px); } figure { position:relative; min-height:220px; margin:0; overflow:hidden; border:1px solid var(--line); background:#071127; isolation:isolate; transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease; } figure:hover { transform:translateY(-5px); border-color:rgba(104,228,255,.72); box-shadow:0 15px 35px rgba(0,40,100,.26); } figure::after { content:""; position:absolute; inset:0; z-index:2; background:linear-gradient(180deg,transparent 48%,rgba(1,5,15,.78)); pointer-events:none; }.wide { grid-column:span 7; min-height:356px; }.tall { grid-column:span 5; min-height:356px; }.small { grid-column:span 4; min-height:252px; }
    .art { position:absolute; inset:0; overflow:hidden; }.art::before,.art::after { content:""; position:absolute; }.stars { background-color:#05091a; background-image:radial-gradient(circle at 8% 26%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 58% 16%,rgba(212,237,255,.9) 0 1px,transparent 1.5px),radial-gradient(circle at 83% 36%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 29% 74%,rgba(183,225,255,.8) 0 1px,transparent 1.5px),radial-gradient(circle at 66% 76%,rgba(255,255,255,.8) 0 1px,transparent 1.5px); background-size:115px 97px,137px 119px,181px 147px,91px 79px,155px 131px; }
    .planet-blue { background:radial-gradient(circle at 23% 21%,rgba(51,130,226,.22),transparent 34%),linear-gradient(130deg,#030717 30%,#0a1c40 100%); }.planet-blue::before { width:75%; aspect-ratio:1; right:-15%; bottom:-39%; border-radius:50%; background:radial-gradient(circle at 29% 25%,#76c9ff 0%,#245588 28%,#0b2147 54%,#020713 73%); box-shadow:-12px -8px 45px rgba(71,172,255,.37),0 0 85px rgba(22,113,255,.14); }.planet-blue::after { width:104%; height:13%; right:-15%; bottom:11%; border:1px solid rgba(120,212,255,.48); border-width:1px 0 0; border-radius:50%; transform:rotate(-14deg); box-shadow:0 -6px 25px rgba(84,192,255,.21); }
    .nebula { background:radial-gradient(ellipse at 27% 67%,rgba(253,83,187,.52),transparent 13%),radial-gradient(ellipse at 44% 47%,rgba(100,76,253,.38),transparent 29%),radial-gradient(ellipse at 68% 38%,rgba(47,174,255,.33),transparent 28%),#040719; }.nebula::before { inset:-20%; background:repeating-radial-gradient(ellipse at 48% 54%,transparent 0 15px,rgba(255,255,255,.03) 18px 20px); transform:rotate(-17deg); mix-blend-mode:screen; opacity:.7; }.nebula::after { width:54%; height:54%; top:21%; left:22%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.86) 0 1px,rgba(132,221,255,.33) 2px,transparent 52%); filter:blur(.2px); }
    .ring-world { background:radial-gradient(ellipse at 52% 23%,rgba(171,140,255,.24),transparent 31%),linear-gradient(150deg,#060718,#111235); }.ring-world::before { width:67%; aspect-ratio:1; top:11%; left:18%; border-radius:50%; background:radial-gradient(circle at 34% 26%,#d2b18a 0,#9b6552 22%,#4e2945 51%,#130d29 72%); box-shadow:-5px -5px 32px rgba(230,174,132,.25); }.ring-world::after { width:114%; height:25%; top:43%; left:-7%; border:2px solid rgba(225,202,185,.64); border-width:2px 0; border-radius:50%; transform:rotate(-18deg); box-shadow:0 0 18px rgba(223,196,165,.2); }
    .horizon { background:linear-gradient(180deg,#030715 25%,#0d2541 63%,#020713 64%); }.horizon::before { width:110%; height:62%; bottom:-44%; left:-5%; border-radius:50% 50% 0 0; background:radial-gradient(ellipse at 50% 0,#6dc9ff 0%,#235b91 26%,#0a1f41 54%,#020714 79%); box-shadow:0 -12px 35px rgba(90,198,255,.37); }.horizon::after { width:2px; height:34%; top:12%; left:52%; background:#b2ebff; box-shadow:0 0 17px 4px rgba(70,203,255,.65); }
    .eclipse { background:radial-gradient(circle at 61% 38%,#0a142d 0 11%,rgba(32,126,204,.22) 11.5%,transparent 26%),linear-gradient(136deg,#07061d,#091c40); }.eclipse::before { width:41%; aspect-ratio:1; top:23%; left:41%; border-radius:50%; background:#010208; box-shadow:0 0 0 3px rgba(89,205,255,.16),0 0 49px 15px rgba(58,143,255,.46); }.eclipse::after { width:95%; height:45%; left:-24%; top:46%; border-radius:50%; border:1px solid rgba(90,193,255,.3); transform:rotate(-23deg); }
    .comet { background:radial-gradient(ellipse at 83% 25%,rgba(73,181,255,.23),transparent 28%),linear-gradient(128deg,#040715,#0c1232); }.comet::before { width:10px; height:10px; top:31%; left:59%; border-radius:50%; background:#effdff; box-shadow:0 0 16px 5px rgba(104,228,255,.93); }.comet::after { width:58%; height:3px; top:34%; left:7%; background:linear-gradient(90deg,transparent,rgba(91,202,255,.05),rgba(153,236,255,.75)); transform:rotate(13deg); filter:blur(1px); }
    figcaption { position:absolute; z-index:3; right:17px; bottom:14px; left:17px; display:flex; justify-content:space-between; align-items:end; gap:10px; color:#dff7ff; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } figcaption small { color:var(--cyan); font:10px "Courier New",monospace; letter-spacing:.06em; text-align:right; } footer { display:flex; justify-content:space-between; margin:45px auto 0; max-width:1240px; color:var(--muted); font:10px "Courier New",monospace; line-height:1.65; } footer b { color:var(--cyan); font-weight:500; }
    @media(max-width:760px) { .shell { padding:23px; }.brand span:last-child{display:none;} nav{gap:13px;} main{margin-top:62px;}.heading{display:block;margin-bottom:27px;}.heading__note{margin-top:21px;}.gallery{grid-template-columns:1fr 1fr;gap:12px;}.wide,.tall,.small{grid-column:span 1;min-height:205px;}.wide{grid-column:span 2;min-height:275px;}figcaption{right:12px;bottom:11px;left:12px;font-size:9px;}figcaption small{font-size:8px;}footer>:last-child{display:none;} }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas><div class="wash"></div>
  <div class="shell">
    <header><div class="brand"><span class="brand__mark"></span><span>Helios Command</span></div><nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav></header>
    <main>
      <div class="heading"><div><p class="eyebrow">Observatory archive / Selected captures</p><h1>Signal<span>gallery.</span></h1></div><p class="heading__note">A living record from Helios Array 07. Every frame began as a faint pattern in the deep.</p></div>
      <section class="gallery" aria-label="Deep space image gallery">
        <figure class="wide"><div class="art stars planet-blue"></div><figcaption>Kepler-442c rise <small>Frame 01 / 2164</small></figcaption></figure>
        <figure class="tall"><div class="art stars nebula"></div><figcaption>Carina veil <small>Frame 08 / 2163</small></figcaption></figure>
        <figure class="small"><div class="art stars ring-world"></div><figcaption>Asterion rings <small>Frame 13</small></figcaption></figure>
        <figure class="small"><div class="art stars horizon"></div><figcaption>Terminator line <small>Frame 21</small></figcaption></figure>
        <figure class="small"><div class="art stars eclipse"></div><figcaption>Silent eclipse <small>Frame 34</small></figcaption></figure>
        <figure class="small"><div class="art stars comet"></div><figcaption>Ion tracer <small>Frame 42</small></figcaption></figure>
      </section>
    </main>
    <footer><div>Archive access / Public relay</div><div>Frames collected / <b>06 / 06</b></div></footer>
  </div>
  <script>
    (()=>{const c=document.querySelector('#space'),x=c.getContext('2d');let w,h,s=[];function size(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);s=Array.from({length:Math.max(180,w*h/3600)},()=>[Math.random()*w,Math.random()*h,Math.random()*1.3+.15,Math.random()*.6+.15]);draw()}function draw(){x.fillStyle='#030613';x.fillRect(0,0,w,h);s.forEach(a=>{x.fillStyle=`rgba(215,242,255,${a[3]})`;x.beginPath();x.arc(a[0],a[1],a[2],0,7);x.fill()})}addEventListener('resize',size);size()})();
  </script>
</body>
</html>
